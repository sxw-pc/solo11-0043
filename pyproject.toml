[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batchsched"
version = "0.1.0"
description = "Offline batch collection DAG orchestration and resume ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "requests>=2.31,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
batchsched = "batchsched.cli:main"

[tool.setuptools.packages.find]
include = ["batchsched*"]

[tool.setuptools.package-data]
"batchsched.mocksite" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
